name: Pull-EntraOpsPrivilegedEAM
env:
  ClientId: YourClientId
  TenantId: YourTenantId
  TenantName: YourTenantName
  ConfigFile: ./EntraOpsConfig.json
  ApplyAutomatedClassificationUpdate: false
  ApplyAutomatedControlPlaneScopeUpdate: false
  FailOnContradictoryTierPair: false
  FailOnPrivilegedAssignmentWithoutClassification: false
  AuthenticationType: FederatedCredentials
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # The schedule trigger is added by Update-EntraOpsRequiredWorkflowParameters from
  # WorkflowTrigger.PullScheduledCron. Shipping a placeholder cron would make GitHub
  # reject this workflow file before the repository is configured.
permissions:
  id-token: write
  contents: write

concurrency:
  group: entraops-main-writer
  cancel-in-progress: false

jobs:
  Pull-EntraOpsPrivilegedEAM:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Connect Azure OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{env.ClientId}}
          tenant-id: ${{env.TenantId}}
          allow-no-subscriptions: true
          enable-AzPSSession: true
      - name: Get updated definition files for classification
        if: env.ApplyAutomatedClassificationUpdate == 'true'
        uses: azure/powershell@f5b8adcfff1904872c7b98d4012d4914d74b1a82 # v3
        with:
          inlineScript: |
            Import-Module ./EntraOps
            Connect-EntraOps -AuthenticationType FederatedCredentials -TenantName ${env:TenantName} -ConfigFile ${env:ConfigFile}
            $ClassificationUpdateParams = $EntraOpsConfig.AutomatedClassificationUpdate
            Update-EntraOpsClassificationFiles @ClassificationUpdateParams
          azPSVersion: latest
      - name: Get updated scope for definition of Control Plane in Entra ID
        if: env.ApplyAutomatedControlPlaneScopeUpdate == 'true'
        uses: azure/powershell@f5b8adcfff1904872c7b98d4012d4914d74b1a82 # v3
        with:
          inlineScript: |
            Import-Module ./EntraOps
            Connect-EntraOps -AuthenticationType FederatedCredentials -TenantName ${env:TenantName} -ConfigFile ${env:ConfigFile}
            $CpUpdateParams = $EntraOpsConfig.AutomatedControlPlaneScopeUpdate
            Update-EntraOpsClassificationControlPlaneScope @CpUpdateParams
          azPSVersion: latest
      - name: Run Save-EntraOpsPrivilegedEAMJson
        uses: azure/powershell@f5b8adcfff1904872c7b98d4012d4914d74b1a82 # v3
        with:
          inlineScript: |
            Import-Module ./EntraOps
            Connect-EntraOps -AuthenticationType FederatedCredentials -TenantName ${env:TenantName} -ConfigFile ${env:ConfigFile}
            Save-EntraOpsPrivilegedEAMJson -RbacSystems $($EntraOpsConfig.RbacSystems)
            Disconnect-EntraOps
          azPSVersion: latest
      - name: Validate generated Privileged EAM artifacts
        shell: pwsh
        run: |
          Import-Module ./EntraOps
          $Strict = '${{ env.FailOnContradictoryTierPair }}' -eq 'true'
          $StrictEmptyClassification = '${{ env.FailOnPrivilegedAssignmentWithoutClassification }}' -eq 'true'
          Test-EntraOpsGeneratedArtifacts -PrivilegedEamPath ./PrivilegedEAM -FailOnContradictoryTierPair:$Strict -FailOnPrivilegedAssignmentWithoutClassification:$StrictEmptyClassification
      - name: Git - Commit and Push to repository
        uses: ./.github/actions/Git-Push
        with:
          paths: Classification/Templates Classification/${{ env.TenantName }} PrivilegedEAM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
