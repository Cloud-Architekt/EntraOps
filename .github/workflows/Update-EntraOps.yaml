name: Update-EntraOps
env:
  ClientId: YourClientId
  TenantId: YourTenantId
  TenantName: YourTenantName
  ConfigFile: ./EntraOpsConfig.json
  ApplyAutomatedEntraOpsUpdate: false
  ValidationFrequency: OnChange
  RunBrowserTests: true
  PublicationMode: PullRequest
  AuthenticationType: FederatedCredentials
on:
  workflow_dispatch:
    inputs:
      force:
        description: Validate and apply even when this source commit is already installed
        required: false
        default: false
        type: boolean
      validation_required:
        description: Override validation for this run (false permits applying an unvalidated candidate)
        required: true
        default: configured
        type: choice
        options:
          - configured
          - "true"
          - "false"
      run_browser_tests:
        description: Override whether browser tests run when candidate validation is required
        required: true
        default: configured
        type: choice
        options:
          - configured
          - "true"
          - "false"
      publication_mode:
        description: Override how the applied update is published
        required: true
        default: configured
        type: choice
        options:
          - configured
          - pull-request
          - direct-push
  # The schedule trigger is added by Update-EntraOpsRequiredWorkflowParameters from
  # AutomatedEntraOpsUpdate.UpdateScheduledCron. Shipping a placeholder cron would make
  # GitHub reject this workflow file before the repository is configured.
permissions:
  contents: read
jobs:
  # The env context is unavailable in a job-level "if", so the switch is evaluated per step and the
  # downstream jobs gate on the resolver's change decision instead.
  Resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      candidate_digest: ${{ steps.resolve.outputs.candidate_digest }}
      update_required: ${{ steps.resolve.outputs.update_required }}
      validation_required: ${{ steps.resolve.outputs.validation_required }}
      run_browser_tests: ${{ steps.resolve.outputs.run_browser_tests }}
      publication_mode: ${{ steps.resolve.outputs.publication_mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve immutable candidate without executing it
        id: resolve
        if: env.ApplyAutomatedEntraOpsUpdate == 'true' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          ENTRAOPS_PAT: ${{ secrets.EntraOpsUpdatePat }}
          VALIDATION_REQUIRED_OVERRIDE: ${{ inputs.validation_required }}
          RUN_BROWSER_TESTS_OVERRIDE: ${{ inputs.run_browser_tests }}
          PUBLICATION_MODE_OVERRIDE: ${{ inputs.publication_mode }}
          WORKFLOW_PUBLISHER_CLIENT_ID: ${{ vars.EntraOpsUpdateAppClientId }}
        run: ./.github/scripts/Resolve-EntraOpsGitHubUpdate.ps1 -ConfigFile ${env:ConfigFile} -ValidationFrequency ${env:ValidationFrequency} -RunBrowserTests ([System.Convert]::ToBoolean(${env:RunBrowserTests})) -PublicationMode ${env:PublicationMode} -ValidationRequiredOverride $env:VALIDATION_REQUIRED_OVERRIDE -RunBrowserTestsOverride $env:RUN_BROWSER_TESTS_OVERRIDE -PublicationModeOverride $env:PUBLICATION_MODE_OVERRIDE -WorkflowPublisherConfigured (-not [string]::IsNullOrWhiteSpace($env:WORKFLOW_PUBLISHER_CLIENT_ID)) -Force:('${{ inputs.force }}' -eq 'true') | Out-Host
      - name: Transfer immutable candidate to the credential-free validation job
        if: steps.resolve.outcome == 'success' && steps.resolve.outputs.validation_required == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EntraOps-update-candidate
          path: EntraOps-update-candidate.tar
          retention-days: 1
          if-no-files-found: error

  Validate:
    needs: Resolve
    if: needs.Resolve.outputs.validation_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Candidate tests and npm scripts run in this job. They must be able to see only the trusted
      # validator scripts, never the deployment's generated tenant data (PrivilegedEAM,
      # TenantGovernance, Classification), so only .github/scripts is checked out.
      - name: Checkout trusted deployment validators only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: true
      - name: Download resolved candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: EntraOps-update-candidate
          path: .update-candidate
      # No npm cache here: candidate code must not populate a cache restored by trusted jobs.
      - name: Set up Node for candidate browser tests
        if: needs.Resolve.outputs.run_browser_tests == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install candidate validation dependencies
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.7.1 -Scope CurrentUser -Force -Repository PSGallery
          Install-Module powershell-yaml -RequiredVersion 0.4.12 -Scope CurrentUser -Force -Repository PSGallery
      - name: Validate candidate without repository credentials
        shell: pwsh
        run: ./.github/scripts/Test-EntraOpsUpdateCandidate.ps1 -CandidateRoot ./TmpUpdate -ArchivePath ./.update-candidate/EntraOps-update-candidate.tar -ExpectedArchiveSha256 '${{ needs.Resolve.outputs.candidate_digest }}' -RunBrowserTests:('${{ needs.Resolve.outputs.run_browser_tests }}' -eq 'true')

  Apply:
    needs: [Resolve, Validate]
    if: always() && needs.Resolve.result == 'success' && needs.Resolve.outputs.update_required == 'true' && (needs.Resolve.outputs.validation_required != 'true' || needs.Validate.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    concurrency:
      group: entraops-main-writer
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Update-EntraOps can replace both ./EntraOps and ./.github/scripts. Freeze the reviewed
      # publisher before applying the candidate so write credentials never reach candidate code.
      - name: Stage trusted GitHub publisher
        shell: pwsh
        run: Copy-Item -LiteralPath ./.github/scripts/Publish-EntraOpsGitHubUpdate.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'Publish-EntraOpsGitHubUpdate.ps1') -Force
      - name: Resolve the selected SHA without executing candidate code
        shell: pwsh
        env:
          ENTRAOPS_PAT: ${{ secrets.EntraOpsUpdatePat }}
        run: |
          Import-Module ./EntraOps
          Get-EntraOpsUpdateCandidate `
            -ConfigFile ${env:ConfigFile} `
            -DestinationPath ./TmpUpdate `
            -ExpectedSourceCommit '${{ needs.Resolve.outputs.source_sha }}' | Out-Host
      - name: Apply candidate without update credentials
        shell: pwsh
        run: |
          Import-Module ./EntraOps
          Install-EntraOpsUpdateCandidate -ConfigFile ${env:ConfigFile} -SourceCommit '${{ needs.Resolve.outputs.source_sha }}' -ValidationRequired:('${{ needs.Resolve.outputs.validation_required }}' -eq 'true') -BrowserTestsValidated:('${{ needs.Resolve.outputs.run_browser_tests }}' -eq 'true')
      - name: Detect updated workflow definitions
        id: workflow-changes
        shell: pwsh
        run: '"changed=$(@(& git status --porcelain -- .github/workflows).Count -gt 0)".ToLowerInvariant() | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8'
      # GITHUB_TOKEN cannot update .github/workflows. Generate a repository-scoped token only when
      # the explicitly enabled workflow target produced a real diff. Missing App credentials or
      # permissions fail here before any candidate file is published.
      - name: Create workflow publisher token
        id: workflow-publisher-token
        if: steps.workflow-changes.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.EntraOpsUpdateAppClientId }}
          private-key: ${{ secrets.EntraOpsUpdateAppPrivateKey }}
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write
          permission-statuses: write
      # The publisher was copied from the trusted base checkout before candidate application.
      - name: Publish the applied candidate with trusted workflow code
        shell: pwsh
        env:
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_PUBLISH_TOKEN: ${{ steps.workflow-publisher-token.outputs.token }}
          WORKFLOW_CHANGES: ${{ steps.workflow-changes.outputs.changed }}
        run: |
          $Publisher = Join-Path $env:RUNNER_TEMP 'Publish-EntraOpsGitHubUpdate.ps1'
          & $Publisher -ActionsToken $env:ACTIONS_TOKEN -WorkflowPublishToken $env:WORKFLOW_PUBLISH_TOKEN -WorkflowChanges:($env:WORKFLOW_CHANGES -eq 'true') -PublicationMode '${{ needs.Resolve.outputs.publication_mode }}' -SourceCommit '${{ needs.Resolve.outputs.source_sha }}' -ValidationRequired:('${{ needs.Resolve.outputs.validation_required }}' -eq 'true') -BrowserTests:('${{ needs.Resolve.outputs.run_browser_tests }}' -eq 'true')
