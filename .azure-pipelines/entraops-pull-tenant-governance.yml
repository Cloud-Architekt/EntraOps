# Azure DevOps Pipeline for EntraOps Tenant Governance snapshots

trigger: none
pr: none

parameters:
  # BEGIN EntraOps managed service connection
  - name: serviceConnection
    displayName: Azure Resource Manager service connection
    type: string
    default: 'EntraOps-ServiceConnection'
  # END EntraOps managed service connection
  - name: operation
    displayName: Snapshot operation for manual runs
    type: string
    default: RunAndWait
    values:
      - Start
      - Collect
      - RunAndWait
  - name: timeoutInSeconds
    displayName: Maximum wait for RunAndWait
    type: number
    default: 3300

# BEGIN EntraOps managed schedules
# Schedules are added by Update-EntraOpsAzureDevOpsSchedules from EntraOpsConfig.json.
# END EntraOps managed schedules
variables:
  ConfigFile: ./EntraOpsConfig.json

pool:
  vmImage: ubuntu-latest

jobs:
  # The larger bound is only needed for a manual RunAndWait (timeoutInSeconds up to 3300); the default job timeout is 60 minutes
  - job: TenantGovernance
    displayName: "Tenant Governance snapshot"
    timeoutInMinutes: 75
    steps:
      - checkout: self
        displayName: "Checkout repository"

      - task: AzurePowerShell@5
        displayName: "Run Tenant Governance snapshot operation"
        inputs:
          azureSubscription: ${{ parameters.serviceConnection }}
          ScriptType: InlineScript
          Inline: |
            Import-Module ./EntraOps
            $Config = Get-Content -LiteralPath '$(ConfigFile)' -Raw | ConvertFrom-Json -Depth 20
            if ($Config.TenantGovernanceSnapshot.EnableTenantGovernanceSnapshot -ne $true) {
              Write-Host 'Tenant Governance snapshots are disabled in the configuration.'
              exit 0
            }

            $Operation = '${{ parameters.operation }}'
            if ($env:BUILD_REASON -eq 'Schedule') {
              $Operation = if ($env:BUILD_CRONSCHEDULE_DISPLAYNAME -eq 'EntraOps Tenant Governance start') { 'Start' } else { 'Collect' }
            }
            try {
              Invoke-EntraOpsTenantGovernanceSnapshot -ConfigFilePath '$(ConfigFile)' -AuthenticationType FederatedCredentials -Operation $Operation -TimeoutInSeconds ${{ parameters.timeoutInSeconds }} -Force | Out-Host
            } catch {
              # Released job: failure recorded, pending job removed and nothing published
              $SnapshotFolder = 'TenantGovernance/Snapshots'
              $IsChanged = { param($Name) -not [string]::IsNullOrWhiteSpace((git status --porcelain -- "$SnapshotFolder/$Name" | Out-String)) }
              if ((& $IsChanged '.LastAttemptManifest.json') -and -not (& $IsChanged '.SnapshotManifest.json') -and -not (Test-Path -LiteralPath "$SnapshotFolder/.PendingSnapshotJob.json")) {
                Write-Host '##vso[task.setvariable variable=EntraOpsReleasedSnapshotJob]true'
              }
              throw
            }
          pwsh: true
          azurePowerShellVersion: LatestVersion

      - task: PowerShell@2
        displayName: "Git Commit & Push"
        inputs:
          targetType: filePath
          filePath: "./.azure-pipelines/scripts/Ado-GitPush.ps1"
          arguments: '-CommitMessage "EntraOps Tenant Governance snapshot"'
          pwsh: true
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      # Commit the released job, so the next run doesn't restore it; the run stays failed
      - task: PowerShell@2
        displayName: "Git Commit & Push released snapshot job state"
        condition: and(failed(), eq(variables['EntraOpsReleasedSnapshotJob'], 'true'))
        inputs:
          targetType: filePath
          filePath: "./.azure-pipelines/scripts/Ado-GitPush.ps1"
          arguments: '-CommitMessage "EntraOps Tenant Governance snapshot job released" -Paths "TenantGovernance/Snapshots/.PendingSnapshotJob.json","TenantGovernance/Snapshots/.LastAttemptManifest.json"'
          pwsh: true
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
