# Azure DevOps Pipeline for EntraOps report generation

trigger: none
pr: none

parameters:
  # BEGIN EntraOps managed service connection
  - name: serviceConnection
    displayName: Azure Resource Manager service connection
    type: string
    default: 'EntraOps-ServiceConnection'
  # END EntraOps managed service connection
  - name: allowStaleTenantGovernance
    displayName: Allow a Tenant Governance snapshot older than its maximum age for this run (unchecked applies StaleTenantGovernanceSnapshotAction)
    type: boolean
    default: false
  - name: allowPartialTenantGovernance
    displayName: Allow a mixed partial Tenant Governance snapshot
    type: boolean
    default: true

resources:
  pipelines:
    - pipeline: entraops-pull
      source: entraops-pull
      trigger: true

# BEGIN EntraOps managed schedules
# END EntraOps managed schedules

variables:
  ConfigFile: ./EntraOpsConfig.json

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0
    displayName: "Checkout repository"

  # A run triggered by entraops-pull starts on the commit the pull run started from; use the data it committed since
  - task: PowerShell@2
    displayName: "Checkout latest branch commit"
    inputs:
      targetType: filePath
      filePath: "./.azure-pipelines/scripts/Ado-CheckoutLatest.ps1"
      pwsh: true
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - task: AzurePowerShell@5
    displayName: "Generate configured reports"
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      ScriptType: InlineScript
      Inline: |
        Import-Module ./EntraOps
        $Config = Get-Content -LiteralPath '$(ConfigFile)' -Raw | ConvertFrom-Json -Depth 20
        if ($Config.AutomatedReportingGeneration.ApplyAutomatedReportingGeneration -ne $true -or
            ($env:BUILD_REASON -eq 'ResourceTrigger' -and $Config.WorkflowTrigger.PushReportingAfterPullWorkflowTrigger -eq $false)) {
          Write-Host 'Automated reporting is disabled for this trigger.'
          Write-Host '##vso[task.setvariable variable=ReportingEnabled]false'
          exit 0
        }

        Write-Host '##vso[task.setvariable variable=ReportingEnabled]true'
        $ClassificationRepository = [string]$Config.AutomatedReportingGeneration.ClassificationExplorerRepository
        if (-not [string]::IsNullOrWhiteSpace($ClassificationRepository)) {
          git clone --depth 1 --filter=blob:none --sparse "https://github.com/$ClassificationRepository.git" ./.reporting/AzurePrivilegedIAM
          if ($LASTEXITCODE -ne 0) { throw 'Could not clone the configured classification repository.' }
          git -C ./.reporting/AzurePrivilegedIAM sparse-checkout set Classification
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure the sparse classification checkout.' }
        }

        $ReportingParameters = @{
          ConfigFilePath                         = '$(ConfigFile)'
          AuthenticationType                     = 'FederatedCredentials'
          AllowPartialTenantGovernanceSnapshot   = [bool]::Parse('${{ parameters.allowPartialTenantGovernance }}')
          RemoveClassificationRepositoryAfterRun = $true
        }
        # Only a manual override skips the stale snapshot check; otherwise ConfigurationAnalyzer.StaleTenantGovernanceSnapshotAction applies
        if ([bool]::Parse('${{ parameters.allowStaleTenantGovernance }}')) {
          $ReportingParameters.AllowStaleTenantGovernanceSnapshot = $true
        }
        Invoke-EntraOpsReportingGeneration @ReportingParameters | Out-Host
      pwsh: true
      azurePowerShellVersion: LatestVersion

  - task: UseNode@1
    displayName: "Use Node.js 22"
    condition: eq(variables.ReportingEnabled, 'true')
    inputs:
      version: "22.x"

  - script: npm ci
    displayName: "Install report test dependencies"
    condition: eq(variables.ReportingEnabled, 'true')

  - script: npx playwright install --with-deps chromium
    displayName: "Install Chromium"
    condition: eq(variables.ReportingEnabled, 'true')

  - script: npm run test:reports
    displayName: "Test generated reports"
    condition: eq(variables.ReportingEnabled, 'true')

  - task: PowerShell@2
    displayName: "Check Azure DevOps project visibility"
    condition: eq(variables.ReportingEnabled, 'true')
    inputs:
      targetType: inline
      script: |
        $Headers = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" }
        $ProjectUri = "${env:SYSTEM_COLLECTIONURI}_apis/projects/${env:SYSTEM_TEAMPROJECTID}?api-version=7.1"
        try {
          $Project = Invoke-RestMethod -Uri $ProjectUri -Headers $Headers -Method Get
          $IsPrivate = $Project.visibility -eq 'private'
        } catch {
          Write-Warning "Could not verify project visibility. Reporting artifacts will not be published. $($_.Exception.Message)"
          $IsPrivate = $false
        }
        Write-Host "##vso[task.setvariable variable=ProjectIsPrivate]$($IsPrivate.ToString().ToLowerInvariant())"
      pwsh: true
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - task: PublishPipelineArtifact@1
    displayName: "Publish EntraOps Reporting artifact"
    condition: and(eq(variables.ReportingEnabled, 'true'), eq(variables.ProjectIsPrivate, 'true'))
    inputs:
      targetPath: Reports
      artifact: EntraOps-Reporting
      publishLocation: pipeline
