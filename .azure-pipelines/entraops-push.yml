# Azure DevOps Pipeline for EntraOps Log Analytics Ingestion
# Pushes collected PrivilegedEAM JSON from the pipeline branch to Log Analytics via Logs Ingestion API.
#
# Prerequisites:
#   1. Data Collection Rule (DCR) and Data Collection Endpoint (DCE) must exist
#      in the target resource group with a data flow for Custom-PrivilegedEAM_CL.
#   2. The service principal used by the ADO Service Connection must have
#      "Monitoring Metrics Publisher" role on the DCR (Log Analytics Contributor
#      on the resource group is NOT sufficient for the Logs Ingestion API).
#   3. EntraOpsConfig.json must contain a populated LogAnalytics section.
#   4. The pull pipeline must have run and committed JSON to the pipeline branch.
#
# Trigger modes:
#   A) Automatic: after entraops-pull completes (configure build completion
#      in ADO UI, or match the pipeline resource name below).
#   B) Manual: run on-demand from the Pipelines UI.
#   C) Scheduled: add a schedules block if desired.

trigger: none
pr: none

parameters:
  # BEGIN EntraOps managed service connection
  - name: serviceConnection
    displayName: Azure Resource Manager service connection
    type: string
    default: 'EntraOps-ServiceConnection'
  # END EntraOps managed service connection

# Option A: Trigger automatically when the pull pipeline completes.
# The source name must match the pull pipeline's name as configured in ADO.
resources:
  pipelines:
    - pipeline: entraops-pull
      source: entraops-pull
      # Only pull runs of the pipeline branch trigger this pipeline (Update-EntraOpsAzureDevOpsSchedules -BranchName)
      # BEGIN EntraOps managed pipeline trigger
      trigger:
        branches:
          include:
            - 'main'
      # END EntraOps managed pipeline trigger

variables:
  # Path to the environment-specific config file (committed in the pipeline branch)
  ConfigFile: ./EntraOpsConfig.json

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    displayName: "Checkout repository"

  # A run triggered by entraops-pull starts on the commit the pull run started from; use the data it committed since
  - task: PowerShell@2
    displayName: "Checkout latest branch commit"
    inputs:
      targetType: filePath
      filePath: "./.azure-pipelines/scripts/Ado-CheckoutLatest.ps1"
      pwsh: true
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  # Ingest collected PrivilegedEAM JSON to target tenant Log Analytics custom table.
  # Connect-EntraOps is intentionally omitted because this step does not require
  # Microsoft Graph access; it only reads local JSON and pushes to the DCR/DCE
  # using the Azure PowerShell context provided by AzurePowerShell@5.
  - task: AzurePowerShell@5
    displayName: "Run configured push operations"
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      ScriptType: InlineScript
      Inline: |
        Import-Module ./EntraOps
        $ErrorActionPreference = "Stop"

        $Config = Get-Content -Path '$(ConfigFile)' | ConvertFrom-Json -Depth 10 -AsHashtable
        if ($env:BUILD_REASON -eq 'ResourceTrigger' -and $Config.WorkflowTrigger.PushAfterPullWorkflowTrigger -eq $false) {
          Write-Host 'Push-after-pull is disabled in the configuration.'
          exit 0
        }

        $HasConfiguredOperation = $Config.LogAnalytics.IngestToLogAnalytics -eq $true -or
          $Config.SentinelWatchLists.IngestToWatchLists -eq $true -or
          $Config.AutomatedAdministrativeUnitManagement.ApplyAdministrativeUnitAssignments -eq $true -or
          $Config.AutomatedRmauAssignmentsForUnprotectedObjects.ApplyRmauAssignmentsForUnprotectedObjects -eq $true -or
          $Config.AutomatedConditionalAccessTargetGroups.ApplyConditionalAccessTargetGroups -eq $true -or
          $Config.AutomatedElmCatalogProtection.ApplyPrivilegedElmCatalogProtection -eq $true
        if (-not $HasConfiguredOperation) {
          Write-Host 'No push operation is enabled in the configuration.'
          exit 0
        }

        Connect-EntraOps -AuthenticationType FederatedCredentials -TenantName $Config.TenantName -ConfigFilePath '$(ConfigFile)'
        try {
          if ($Config.LogAnalytics.IngestToLogAnalytics -eq $true) {
            $LogAnalyticsParams = $EntraOpsConfig.LogAnalytics
            Save-EntraOpsPrivilegedEAMInsightsCustomTable @LogAnalyticsParams
          }
          if ($Config.SentinelWatchLists.IngestToWatchLists -eq $true) {
            $WatchListParams = $EntraOpsConfig.SentinelWatchLists
            Save-EntraOpsPrivilegedEAMWatchLists @WatchListParams
          }
          if ($Config.AutomatedAdministrativeUnitManagement.ApplyAdministrativeUnitAssignments -eq $true) {
            $AdministrativeUnitParams = $EntraOpsConfig.AutomatedAdministrativeUnitManagement
            New-EntraOpsPrivilegedAdministrativeUnit @AdministrativeUnitParams
            Update-EntraOpsPrivilegedAdministrativeUnit @AdministrativeUnitParams
          }
          if ($Config.AutomatedRmauAssignmentsForUnprotectedObjects.ApplyRmauAssignmentsForUnprotectedObjects -eq $true) {
            $RmauParams = $EntraOpsConfig.AutomatedRmauAssignmentsForUnprotectedObjects
            New-EntraOpsPrivilegedUnprotectedAdministrativeUnit @RmauParams
            Update-EntraOpsPrivilegedUnprotectedAdministrativeUnit @RmauParams
          }
          if ($Config.AutomatedConditionalAccessTargetGroups.ApplyConditionalAccessTargetGroups -eq $true) {
            $ConditionalAccessParams = $EntraOpsConfig.AutomatedConditionalAccessTargetGroups
            New-EntraOpsPrivilegedConditionalAccessGroup @ConditionalAccessParams
            Update-EntraOpsPrivilegedConditionalAccessGroup @ConditionalAccessParams
          }
          if ($Config.AutomatedElmCatalogProtection.ApplyPrivilegedElmCatalogProtection -eq $true) {
            $ElmCatalogParams = $EntraOpsConfig.AutomatedElmCatalogProtection
            Update-EntraOpsPrivilegedUnprotectedElmCatalog @ElmCatalogParams
          }
        } finally {
          Disconnect-EntraOps
        }
      pwsh: true
      azurePowerShellVersion: LatestVersion
